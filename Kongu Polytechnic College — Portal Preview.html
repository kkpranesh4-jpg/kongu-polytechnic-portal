function formatDate(value) {
  if (!value) return '—'
  try {
    const date = new Date(`${value}T00:00:00`)
    return Number.isNaN(date.getTime()) ? '—' : new Intl.DateTimeFormat('en-IN', { day: '2-digit', month: 'short', year: 'numeric' }).format(date)
  } catch {

function buildAttendance() {
  const records = {}
  Object.values(SEMESTERS).forEach((semester, semIndex) => {
    semester.dates.forEach((date, dateIndex) => semester.subjects.forEach((subject, subjectIndex) => STUDENTS.forEach((student, studentIndex) => {
      const score = (studentIndex * 3 + dateIndex * 2 + subjectIndex + semIndex * 5) % 10
      const odScore = (score + semIndex * 2) % 10 === 9
      const presentThreshold = [7, 6, 5, 5, 7, 9][semIndex] - (studentIndex % 2)
      records[keyFor(student.id, semIndex + 1, subject.id, date)] = odScore ? 'od' : score < presentThreshold ? 'present' : 'absent'
    })))
  })
  return records
}

function buildMarks() {
  const marks = {}
  Object.values(SEMESTERS).forEach((semester, semIndex) => semester.subjects.forEach((subject, subjectIndex) => STUDENTS.forEach((student, studentIndex) => {
    marks[markKey(student.id, semIndex + 1, subject.id)] = { internal: 18 + ((studentIndex * 2 + subjectIndex + semIndex) % 8), exam: 54 + ((studentIndex * 5 + subjectIndex * 3 + semIndex * 4) % 26), assignment: 7 + ((studentIndex + subjectIndex) % 4) }
  })))
  return marks
}

function asRecord(value) {
  return value && typeof value === 'object' && !Array.isArray(value) ? value : {}
}

function asArray(value, fallback = []) {
  return Array.isArray(value) ? value : fallback
}

function asObjectArray(value, fallback = []) {
  return asArray(value, fallback).filter((item) => item && typeof item === 'object' && !Array.isArray(item))
}

function asStringArray(value, fallback = []) {
  return asArray(value, fallback).filter((item) => typeof item === 'string')
}

function loadState() {
  const fallback = createInitialState()
  try {
    const saved = JSON.parse(localStorage.getItem('kongu-portal-data') || 'null')
    if (!saved || !asRecord(saved).attendance || !asRecord(saved).marks) return fallback

    const source = asRecord(saved)
    const savedAssignments = asRecord(source.assignments)
    const savedNotes = asRecord(source.notes)
    const savedAnnouncements = asRecord(source.announcements)
    const savedExtras = asRecord(source.subjectExtras)
    const migrated = {
      ...fallback,
      ...source,
      attendance: { ...fallback.attendance, ...asRecord(source.attendance) },
      marks: { ...fallback.marks, ...asRecord(source.marks) },
      assignments: Object.fromEntries(Object.keys(fallback.assignments).map((semester) => [semester, asObjectArray(savedAssignments[semester], fallback.assignments[semester])])),
      notes: Object.fromEntries(Object.keys(fallback.notes).map((semester) => [semester, asObjectArray(savedNotes[semester], fallback.notes[semester])])),
      announcements: Object.fromEntries(Object.keys(fallback.announcements).map((semester) => [semester, asStringArray(savedAnnouncements[semester], fallback.announcements[semester])])),
      subjectExtras: Object.fromEntries(Object.keys(savedExtras).map((semester) => [semester, asObjectArray(savedExtras[semester])])),
      requests: asObjectArray(source.requests, fallback.requests),
      supportTickets: asObjectArray(source.supportTickets),
      readNotifications: asStringArray(source.readNotifications),
      lostFound: asObjectArray(source.lostFound, fallback.lostFound),
    }
    const oldStudentId = 'KPC24-001'
    const newStudentId = 'KPC23CS041'
    if (!Object.keys(migrated.attendance).some((key) => key.startsWith(`${newStudentId}|`))) {
      Object.entries(migrated.attendance).forEach(([key, value]) => { if (key.startsWith(`${oldStudentId}|`)) migrated.attendance[key.replace(oldStudentId, newStudentId)] = value })
    }
    if (!Object.keys(migrated.marks).some((key) => key.startsWith(`${newStudentId}|`))) {
      Object.entries(migrated.marks).forEach(([key, value]) => { if (key.startsWith(`${oldStudentId}|`)) migrated.marks[key.replace(oldStudentId, newStudentId)] = value })
    }
    if (!Array.isArray(migrated.lostFound) || !migrated.lostFound.length) migrated.lostFound = [...LF_SEED]
    else {
      const existingIds = new Set(migrated.lostFound.map((item) => item && item.id))
      LF_SEED.forEach((item) => { if (!existingIds.has(item.id)) migrated.lostFound.push(item) })
    }
    return migrated
  } catch { return fallback }
}

function attendanceFor(state, studentId, semester, subjectId) {
  const data = getSemester(semester)
  return data.dates.map((date) => state.attendance[keyFor(studentId, Number(semester), subjectId, date)] || 'absent')
}
function attendanceSummary(state, studentId, semester, subjectId) {
  const values = attendanceFor(state, studentId, semester, subjectId)
  const present = values.filter((value) => value === 'present').length
  const od = values.filter((value) => value === 'od').length
  const absent = values.filter((value) => value === 'absent').length
  const attended = present + od
  return { present, absent, od, attended, total: values.length, percentage: values.length ? Math.round((attended / values.length) * 100) : 0 }
}
function semesterSummary(state, studentId, semester) {
  const subjects = getSemester(semester).subjects.map((subject) => attendanceSummary(state, studentId, semester, subject.id))
  const present = subjects.reduce((sum, item) => sum + item.present, 0)
  const absent = subjects.reduce((sum, item) => sum + item.absent, 0)
  const od = subjects.reduce((sum, item) => sum + item.od, 0)
  const attended = present + od
  const total = subjects.reduce((sum, item) => sum + item.total, 0)
  return { present, absent, od, attended, total, percentage: total ? Math.round((attended / total) * 100) : 0 }
}
function marksFor(state, studentId, semester) {
  return getSemester(semester).subjects.map((subject) => ({ subject, ...(state.marks[markKey(studentId, Number(semester), subject.id)] || { internal: 0, exam: 0, assignment: 0 }) }))
}
function downloadFile(filename, text, type = 'text/plain') {
  try {
    const blob = new Blob([text], { type })
    const url = URL.createObjectURL(blob)
    const anchor = document.createElement('a')
    anchor.href = url
    anchor.download = filename
    anchor.style.display = 'none'
    document.body.appendChild(anchor)
    anchor.click()
    anchor.remove()
    setTimeout(() => URL.revokeObjectURL(url), 200)
  } catch {
    // Download actions should never take down the current portal page.
  }
}

function getStorage(name) {
  try {
    return typeof window !== 'undefined' ? window[name] : null
  } catch {
    return null
  }
}

function readStorageItem(name, key) {
  try {
    return getStorage(name)?.getItem(key) ?? null
  } catch {
    return null
  }
}

function writeStorageItem(name, key, value) {
  try {
    getStorage(name)?.setItem(key, value)
  } catch {
    // Private browsing, disabled storage, and quota limits should not blank the app.
  }
}

function removeStorageItem(name, key) {
  try {
    getStorage(name)?.removeItem(key)
  } catch {
    // Storage is optional for this locally persisted demo portal.
  }
}

function readJsonStorage(name, key, fallback = null) {
  const value = readStorageItem(name, key)
  if (!value) return fallback
  try {
    return JSON.parse(value)
  } catch {
    return fallback
  }
}

class AppErrorBoundary extends Component {
  state = { hasError: false }

  static getDerivedStateFromError() {
    return { hasError: true }
  }

  componentDidCatch(error) {
    // Keep the route recoverable without turning a render error into a blank page.
    console.error('Portal page failed to render:', error)
  }

  recover = () => {
    this.setState({ hasError: false })
    if (typeof window !== 'undefined') window.location.hash = '/dashboard'
  }

  render() {
    if (this.state.hasError) {
      return (
        <main className="portal-error-page">
          <section className="portal-error-card panel">
            <span className="eyebrow">Academic management portal</span>
            <h1>This page could not be loaded</h1>
            <p>Your portal data is still safe. Return to the dashboard to continue.</p>
            <button className="btn btn-primary" onClick={this.recover}>Return to dashboard</button>
          </section>
        </main>
      )
    }
    return this.props.children
  }
}

    <div className="ams-stat-grid"><div className="ams-stat-card"><div className="ams-stat-top"><span>Attendance</span><div className="ams-stat-icon teal"><CheckCircle2 size={17} /></div></div><strong>{formatPercent(attendancePercent)}</strong><small>Overall attendance</small><b>{attendance.attended}/{attendance.total} classes attended · {attendance.od} OD</b></div><div className="ams-stat-card"><div className="ams-stat-top"><span>CGPA</span><div className="ams-stat-icon purple"><GraduationCap size={17} /></div></div><strong>{cgpa.toFixed(2)}</strong><small>Current CGPA</small><b>Top {semester === '1' ? '12' : 18}% of your class</b></div><div className="ams-stat-card"><div className="ams-stat-top"><span>Internal Assessment</span><div className="ams-stat-icon indigo"><BookOpen size={17} /></div></div><strong>{internalAverage.toFixed(1)} <em>/ 25</em></strong><small>Internal average</small><b>Across {data.subjects.length} subjects</b></div><div className="ams-stat-card"><div className="ams-stat-top"><span>Semester Fees</span><div className="ams-stat-icon amber"><IndianRupee size={17} /></div></div><strong>₹{fee.balance.toLocaleString('en-IN')} <em>due</em></strong><small>Semester fees</small><b>Total ₹{fee.total.toLocaleString('en-IN')} · Due {formatDate(fee.due)}</b></div></div>
    <div className="ams-two-col"><section className="ams-card"><SectionTitle title="Attendance overview" subtitle={`${data.label} · Eligibility status`} action={<button className="ams-link" onClick={() => navigate('attendance')}>View details <ArrowRight size={14} /></button>} /><div className="ams-attendance-body"><div className="ams-donut" style={{ '--attendance': `${attendancePercent}%` }}><div><strong>{formatPercent(attendancePercent)}</strong><span>Good standing</span></div></div><div className="ams-eligibility"><div><ShieldCheck size={16} /><span>Eligible for examinations</span></div><p>Maintain above 75% attendance to remain eligible for your end-semester examinations.</p><div className="ams-mini-bars">{subjectRows.map(({ subject, summary }) => <SubjectProgress key={subject.id} subject={subject} summary={summary} />)}</div></div></div></section><section className="ams-card"><SectionTitle title={`${data.label} academic performance`} subtitle="Internal assessment · Subject-wise" action={<button className="ams-icon-button" title="Download performance" onClick={() => downloadFile(`academic-performance-${semester}.csv`, ['Subject,Faculty,Internal marks', ...rows.map((row) => `${row.subject.name},${row.subject.faculty},${row.internal}`)].join('\n'), 'text/csv')}><Download size={16} /></button>} /><div className="ams-chart"><div className="ams-y-axis"><span>25</span><span>20</span><span>15</span><span>10</span><span>0</span></div><div className="ams-bars">{barValues.map((value, index) => <div className="ams-bar-item" key={`${value}-${index}`}><div className="ams-bar" style={{ height: `${Math.max(25, (value / 25) * 100)}%` }}><b>{value}</b></div><span>{String(601 + index)}</span></div>)}</div></div><div className="ams-chart-footer"><span><i className="ams-dot purple-dot" /> Internal average</span><strong>{internalAverage.toFixed(1)} / 25 <small>Excellent progress</small></strong></div></section></div>
    <div className="ams-two-col"><section className="ams-card"><SectionTitle title="Upcoming examinations" subtitle="Plan your preparation" action={<button className="ams-link" onClick={() => navigate('exams')}>Full schedule <ArrowRight size={14} /></button>} /><div className="ams-exam-list">{upcoming.map((exam, index) => <button className="ams-exam-row" key={exam.name} onClick={() => notify(`${exam.name} is scheduled in ${exam.room}.`)}><div className={`ams-date-box d${index}`}><strong>{new Date(`${exam.date}T00:00:00`).getDate()}</strong><span>{new Intl.DateTimeFormat('en-IN', { month: 'short' }).format(new Date(`${exam.date}T00:00:00`))}</span></div><div><strong>{exam.subject.name}</strong><span>{exam.time} · {exam.room}</span></div><ArrowRight size={15} /></button>)}</div></section><section className="ams-card"><SectionTitle title="Today’s timetable" subtitle="Thursday · 16 April" action={<button className="ams-link" onClick={() => navigate('timetable')}>View timetable <ArrowRight size={14} /></button>} /><div className="ams-timetable-list">{todayClasses.map((item) => <button key={`${item.time}-${item.subjectName}`} onClick={() => notify(`${item.subjectName} with ${item.subject.faculty} · ${item.room}`)}><time>{item.time}</time><div><strong>{item.subjectName}</strong><span>{item.subject.faculty} · {item.room}</span></div><MoreHorizontal size={16} /></button>)}</div></section></div>
    <div className="ams-two-col"><section className="ams-card"><SectionTitle title="Assignments" subtitle={`${assignments.length} coursework items`} action={<button className="ams-link" onClick={() => navigate('assignments')}>View all <ArrowRight size={14} /></button>} /><div className="ams-assignment-list">{assignments.slice(0, 4).map((item) => { const isDone = completed.includes(item.id); return <button key={item.id} onClick={() => toggleAssignment(item)}><span className={`ams-check ${isDone ? 'done' : ''}`}>{isDone && <Check size={12} />}</span><span><strong>{item.title}</strong><small>{item.subject} · Due {formatDate(item.due)}</small></span><span className={isDone ? 'ams-completed' : 'ams-pending'}>{isDone ? 'Completed' : 'Pending'}</span></button> })}{!assignments.length && <div className="ams-empty">No assignments for this semester.</div>}</div></section><section className="ams-card"><SectionTitle title="Notifications" subtitle="Latest campus updates" action={<button className="ams-link" onClick={() => navigate('notifications')}>See all <ArrowRight size={14} /></button>} /><div className="ams-notification-list">{noticeItems.slice(0, 3).map((item, index) => <button key={item.id} onClick={() => setSelectedNotice(item)}><span className={`ams-notification-dot n${index}`} /><span><strong>{item.title}</strong><small>{formatDate(item.date)}</small></span><ChevronDown size={15} /></button>)}</div></section></div>
    <footer className="ams-footer">© 2026 Kongu Polytechnic College / Academic Management Portal <span>· Perundurai</span><a href="mailto:support@kongupolytechnic.ac.in">Privacy &amp; support</a></footer>
    {selectedNotice && <div className="ams-notice-modal" onMouseDown={(event) => event.target === event.currentTarget && setSelectedNotice(null)}><div><button onClick={() => setSelectedNotice(null)}>×</button><Bell size={21} /><h3>{selectedNotice.title}</h3><p>Academic office update for {data.label}. Please check the relevant portal page for more details.</p><small>{formatDate(selectedNotice.date)}</small></div></div>}
  </div>
}

// ==== components/StudentCampusPages.jsx ====
function CampusHeader({ eyebrow, title, description, action }) { return <div className="page-header"><div><div className="eyebrow">{eyebrow}</div><h1>{title}</h1><p>{description}</p></div>{action}</div> }
function CampusSelect({ semester, setSemester }) { return <div className="semester-bar"><div><span>Academic period</span><strong>{getSemester(semester).period}</strong></div><label className="ams-campus-select"><span>Semester</span><select value={semester} onChange={(event) => setSemester(event.target.value)}>{[1, 2, 3, 4, 5, 6].map((id) => <option key={id} value={id}>Semester {id}</option>)}</select><ChevronDown size={15} /></label></div> }

function StudentAssessment({ semester, setSemester, state, notify }) { const student = getStudents()[0]; const rows = marksFor(state, student.id, semester); const attendance = semesterSummary(state, student.id, semester); return <><CampusHeader eyebrow="Assessment" title="Internal Assessment" description="Review your internal assessment marks and examination eligibility." /><CampusSelect semester={semester} setSemester={setSemester} /><div className="ams-assessment-summary"><div><span>Internal average</span><strong>{(rows.reduce((sum, row) => sum + row.internal, 0) / rows.length).toFixed(1)} / 25</strong></div><div><span>Attendance eligibility</span><strong>{attendance.percentage >= 75 ? 'Eligible' : 'Review required'}</strong></div><div><span>Subjects assessed</span><strong>{rows.length}</strong></div></div><section className="panel"><div className="panel-head"><div><h2>Subject assessment record</h2><span>Internal marks are out of 25 · {getSemester(semester).label}</span></div></div><div className="table-scroll"><table><thead><tr><th>Subject</th><th>Faculty</th><th>Internal / 25</th><th>Attendance</th><th>Status</th></tr></thead><tbody>{rows.map((row) => <tr key={row.subject.id}><td><strong>{row.subject.name}</strong><small className="table-sub">{row.subject.code}</small></td><td>{row.subject.faculty}</td><td><strong>{row.internal}</strong></td><td>{Math.round((attendanceForSubject(state, student.id, semester, row.subject.id)))}%</td><td><span className="pill green">Published</span></td></tr>)}</tbody></table></div></section></> }
function attendanceForSubject(state, studentId, semester, subjectId) { return attendanceSummary(state, studentId, semester, subjectId).percentage }

function StudentEvents({ semester, setSemester, notify }) { const data = getSemester(semester); const events = [{ title: 'Academic advising hour', date: data.dates[2], time: '03:00 PM', location: 'Seminar Hall' }, { title: `${data.label} student orientation`, date: data.dates[4], time: '10:00 AM', location: 'Main Auditorium' }, { title: 'Club and placement forum', date: data.dates[6], time: '11:30 AM', location: 'Student Centre' }]; return <><CampusHeader eyebrow="Campus life" title="Events" description="Academic, student and campus events for your semester." /><CampusSelect semester={semester} setSemester={setSemester} /><div className="ams-campus-events">{events.map((event) => <button className="ams-event-card panel" key={event.title} onClick={() => notify(`${event.title} added to your portal view.`)}><div className="ams-event-date"><strong>{new Date(`${event.date}T00:00:00`).getDate()}</strong><span>{new Intl.DateTimeFormat('en-IN', { month: 'short' }).format(new Date(`${event.date}T00:00:00`))}</span></div><div><h3>{event.title}</h3><p>{formatDate(event.date)} · {event.time}</p><small>{event.location}</small></div><CalendarDays size={18} /></button>)}</div></> }

function LeaveRequests({ semester, state, setState, notify }) { const [show, setShow] = useState(false); const [reason, setReason] = useState(''); const student = getStudents()[0]; const own = (state.requests || []).filter((request) => request.studentId === student.id && request.subject === 'Leave request'); const submit = (event) => { event.preventDefault(); if (!reason.trim()) return; setState((previous) => ({ ...previous, requests: [...(previous.requests || []), { id: `leave-${Date.now()}`, studentId: student.id, subject: 'Leave request', message: reason.trim(), status: 'Pending', created: new Date().toISOString().slice(0, 10) }] })); setReason(''); setShow(false); notify('Leave request submitted for review.'); }; return <><CampusHeader eyebrow="Student services" title="Leave Requests" description="Submit and track leave requests with the academic office." action={<button className="btn btn-primary" onClick={() => setShow(true)}><Plus size={16} /> New request</button>} /><section className="panel ams-request-panel">{own.map((request) => <div className="ams-request-row" key={request.id}><div><strong>{request.message}</strong><span>Submitted {formatDate(request.created)}</span></div><span className={`pill ${request.status === 'Approved' ? 'green' : request.status === 'Rejected' ? 'red' : 'orange'}`}>{request.status}</span></div>)}{!own.length && <div className="ams-empty"><ClipboardList size={22} /><strong>No leave requests yet</strong><span>Use New request when you need to notify the academic office.</span></div>}</section>{show && <div className="modal-backdrop"><div className="modal"><div className="modal-head"><h3>New leave request</h3><button className="icon-btn" onClick={() => setShow(false)}><X size={19} /></button></div><form className="modal-form" onSubmit={submit}><label>Reason<textarea rows="5" value={reason} onChange={(event) => setReason(event.target.value)} placeholder="Explain the reason for your leave" required /></label><div className="modal-actions"><button type="button" className="btn btn-secondary" onClick={() => setShow(false)}>Cancel</button><button className="btn btn-primary" type="submit"><Send size={15} /> Submit request</button></div></form></div></div>}</> }

function Feedback({ notify }) { const [rating, setRating] = useState(0); const [message, setMessage] = useState(''); const submit = (event) => { event.preventDefault(); if (!rating || !message.trim()) return; setMessage(''); setRating(0); notify('Thank you. Your feedback was submitted.'); }; return <><CampusHeader eyebrow="Student voice" title="Feedback" description="Share feedback about teaching, facilities and the portal." /><section className="panel ams-feedback"><div className="ams-feedback-intro"><MessageSquare size={22} /><div><h2>How are we doing?</h2><p>Your feedback helps Kongu Polytechnic College improve the student experience.</p></div></div><form onSubmit={submit}><label>Rate your experience<div className="ams-rating">{[1, 2, 3, 4, 5].map((item) => <button type="button" key={item} className={item <= rating ? 'selected' : ''} onClick={() => setRating(item)} aria-label={`${item} stars`}><Star size={22} fill={item <= rating ? 'currentColor' : 'none'} /></button>)}</div></label><label>Comments<textarea rows="6" value={message} onChange={(event) => setMessage(event.target.value)} placeholder="Tell us what went well or what could be improved" required /></label><button className="btn btn-primary" type="submit"><Send size={15} /> Submit feedback</button></form></section></> }

// ==== components/Portal.jsx ====
const STAFF_NAV = [
  ['dashboard', 'Dashboard', LayoutDashboard], ['profile', 'Profile', User], ['students', 'Students', Users], ['attendance', 'Attendance', CheckSquare],
  ['marks', 'Marks / Results', BarChart3], ['internal-assessment', 'Internal Assessment', FileSpreadsheet], ['subjects', 'Subjects', BookOpen],
  ['assignments', 'Assignments', FileText], ['notes', 'Notes / Study Materials', StickyNote], ['exams', 'Examination Schedule', Calendar], ['timetable', 'Timetable', Clock],
  ['announcements', 'Announcements', Megaphone], ['notifications', 'Notifications', Bell], ['reports', 'Reports', FileSpreadsheet], ['requests', 'Student Requests', MessageSquare], ['support', 'Help & Support', HelpCircle], ['lost-found', 'Lost & Found Register', PackageSearch],
]
const STUDENT_NAV = [
  ['dashboard', 'Dashboard', LayoutDashboard], ['profile', 'My Profile', User], ['attendance', 'Attendance', CheckSquare], ['marks', 'Marks / Results', BarChart3], ['internal-assessment', 'Internal Assessment', FileSpreadsheet],
  ['exams', 'Examination Schedule', Calendar], ['timetable', 'Timetable', Clock], ['subjects', 'Subjects', BookOpen], ['assignments', 'Assignments', FileText], ['notes', 'Notes & Materials', StickyNote],
  ['notifications', 'Notifications', Bell], ['announcements', 'Announcements', Megaphone], ['events', 'Events', Calendar], ['fees', 'Fees / Payments', IndianRupee], ['leave-requests', 'Leave Requests', FileText], ['feedback', 'Feedback', MessageSquare], ['support', 'Help & Support', HelpCircle], ['lost-found', 'Lost & Found Register', PackageSearch],
]

function Select({ value, onChange, children, className = '' }) { return <div className={`select-wrap ${className}`}><select value={value} onChange={(event) => onChange(event.target.value)}>{children}</select><ChevronDown size={16} /></div> }
function Button({ children, variant = 'primary', onClick, type = 'button', disabled = false, className = '', title }) { return <button title={title} type={type} disabled={disabled} onClick={onClick} className={`btn btn-${variant} ${className}`}>{children}</button> }
function EmptyState({ title = 'Nothing here yet', text = 'There is no data available for this selection.' }) { return <div className="empty-state"><div className="empty-icon"><FileText size={22} /></div><strong>{title}</strong><span>{text}</span></div> }
function Modal({ title, onClose, children }) { return <div className="modal-backdrop" onMouseDown={(event) => event.target === event.currentTarget && onClose()}><div className="modal"><div className="modal-head"><h3>{title}</h3><button className="icon-btn" onClick={onClose}><X size={19} /></button></div>{children}</div></div> }
function PageHeader({ eyebrow, title, description, actions }) { return <div className="page-header"><div><div className="eyebrow">{eyebrow}</div><h1>{title}</h1>{description && <p>{description}</p>}</div>{actions && <div className="page-actions">{actions}</div>}</div> }
function StatCard({ icon: Icon, label, value, hint, tone = 'blue' }) { return <div className="stat-card"><div className={`stat-icon ${tone}`}><Icon size={20} /></div><div><span>{label}</span><strong>{value}</strong><small>{hint}</small></div></div> }
function ConfirmButton({ children, onConfirm, variant = 'danger', message = 'Are you sure you want to continue?' }) { return <Button variant={variant} onClick={() => window.confirm(message) && onConfirm()}>{children}</Button> }
function StudentNav({ currentPath, go }) { const groups = [['WORKSPACE', STUDENT_NAV.slice(0, 5)], ['ACADEMIC', STUDENT_NAV.slice(5, 10)], ['CAMPUS', STUDENT_NAV.slice(10)]]; return groups.map(([heading, items]) => <div className="student-nav-group" key={heading}><span>{heading}</span>{items.map(([path, label, Icon]) => <button key={path} className={currentPath === path ? 'active' : ''} onClick={() => go(path)}><Icon size={16} /><span>{label}</span></button>)}</div>) }

function Portal({ role, user, route, semester, setSemester, state, setState, navigate, onLogout, notify }) {
  const nav = role === 'staff' ? STAFF_NAV : STUDENT_NAV
  const [mobileOpen, setMobileOpen] = useState(false)
  const [profileOpen, setProfileOpen] = useState(false)
  const student = getStudents()[0]
  const currentPath = route || 'dashboard'
  const go = (path) => { navigate(path); setMobileOpen(false) }
  const displayUser = role === 'staff' ? { name: 'Academic Office', email: 'staff@kongupolytechnic.ac.in', picture: '' } : { ...student, picture: user?.picture || '' }
  return <div className={`portal-shell ${role === 'student' ? 'student-portal' : 'staff-portal'}`}>
    <aside className={`sidebar ${mobileOpen ? 'open' : ''}`}>
      <div className="brand"><div className="brand-mark"><GraduationCap size={23} /></div><div><strong>KONGU</strong><span>POLYTECHNIC COLLEGE</span></div><button className="mobile-close icon-btn" onClick={() => setMobileOpen(false)}><X size={20} /></button></div>
      {role === 'student' ? <div className="student-sidebar-card"><div className="student-sidebar-avatar">A<div className="ams-online-dot" /></div><div><strong>Arjun Kumar</strong><span>KPC23CS041</span></div><span className="online-label">Online</span></div> : <div className="portal-label">STAFF PORTAL</div>}
      <nav>{role === 'student' ? <StudentNav currentPath={currentPath} go={go} /> : nav.map(([path, label, Icon]) => <button key={path} className={currentPath === path ? 'active' : ''} onClick={() => go(path)}><Icon size={17} /><span>{label}</span></button>)}</nav>
      <div className="sidebar-bottom">{role === 'student' && <button className="staff-preview" onClick={() => notify('Staff preview is available from the academic office.')}><ShieldCheck size={16} /><span>Staff preview</span><ChevronDown size={14} /></button>}<button onClick={onLogout}><LogOut size={17} /><span>Logout</span></button></div>
    </aside>
    {mobileOpen && <div className="sidebar-overlay" onClick={() => setMobileOpen(false)} />}
    <section className="content-shell">
      <header className="topbar"><button className="mobile-menu icon-btn" onClick={() => setMobileOpen(true)}><Menu size={22} /></button><div className="crumb">{role === 'student' ? 'Student workspace' : 'Academic Management'} <span>/</span> <b>{nav.find((item) => item[0] === currentPath)?.[1] || 'Dashboard'}</b></div>{role === 'student' ? <div className="student-top-actions"><div className="top-term-select"><select value={semester} onChange={(event) => setSemester(event.target.value)}>{[1, 2, 3, 4, 5, 6].map((id) => <option key={id} value={id}>Semester {id} · {String(id) === semester ? 'Current' : 'Term'}</option>)}</select><ChevronDown size={14} /></div><button className="header-icon-button" onClick={() => go('notifications')} title="Notifications"><Bell size={18} /><i /></button><div className="top-profile-wrap"><button className="top-profile-button" onClick={() => setProfileOpen(!profileOpen)}><div className="top-avatar">A</div><span><strong>Arjun Kumar</strong><small>KPC23CS041</small></span><ChevronDown size={15} /></button>{profileOpen && <div className="top-profile-menu"><button onClick={() => { go('profile'); setProfileOpen(false) }}><User size={15} /> My profile</button><button onClick={onLogout}><LogOut size={15} /> Logout</button></div>}</div></div> : <div className="top-user"><div className="top-avatar">{displayUser.name.slice(0, 1)}</div><div className="top-user-text"><strong>{displayUser.name}</strong><span>Staff</span></div><ChevronDown size={16} /></div>}</header>
      <main className="page-content">
        {currentPath === 'dashboard' && (role === 'student' ? <StudentDashboard semester={semester} setSemester={setSemester} state={state} setState={setState} navigate={go} notify={notify} /> : <Dashboard role={role} semester={semester} setSemester={setSemester} state={state} navigate={go} notify={notify} />)}
        {currentPath === 'profile' && <Profile role={role} user={displayUser} notify={notify} />}
        {currentPath === 'students' && role === 'staff' && <Students semester={semester} setSemester={setSemester} state={state} navigate={go} />}
        {currentPath === 'attendance' && <Attendance role={role} semester={semester} setSemester={setSemester} state={state} setState={setState} notify={notify} />}
        {currentPath === 'marks' && <Marks role={role} semester={semester} setSemester={setSemester} state={state} setState={setState} notify={notify} />}
        {currentPath === 'internal-assessment' && (role === 'staff' ? <InternalAssessment semester={semester} setSemester={setSemester} state={state} setState={setState} notify={notify} /> : <StudentAssessment semester={semester} setSemester={setSemester} state={state} notify={notify} />)}
        {currentPath === 'subjects' && <Subjects role={role} semester={semester} setSemester={setSemester} state={state} setState={setState} notify={notify} />}
        {currentPath === 'assignments' && <Assignments role={role} semester={semester} setSemester={setSemester} state={state} setState={setState} notify={notify} />}
        {currentPath === 'notes' && <Notes role={role} semester={semester} setSemester={setSemester} state={state} setState={setState} notify={notify} />}
        {currentPath === 'exams' && <Exams semester={semester} setSemester={setSemester} notify={notify} />}
        {currentPath === 'timetable' && <Timetable semester={semester} setSemester={setSemester} />}
        {currentPath === 'announcements' && <Announcements role={role} semester={semester} setSemester={setSemester} state={state} setState={setState} notify={notify} />}
        {currentPath === 'notifications' && <Notifications semester={semester} setSemester={setSemester} state={state} setState={setState} notify={notify} />}
        {currentPath === 'reports' && role === 'staff' && <Reports semester={semester} setSemester={setSemester} state={state} notify={notify} />}
        {currentPath === 'requests' && role === 'staff' && <Requests role={role} semester={semester} state={state} setState={setState} notify={notify} />}
        {currentPath === 'fees' && role === 'student' && <Payments semester={semester} setSemester={setSemester} notify={notify} />}
        {currentPath === 'events' && role === 'student' && <StudentEvents semester={semester} setSemester={setSemester} notify={notify} />}
        {currentPath === 'leave-requests' && role === 'student' && <LeaveRequests semester={semester} state={state} setState={setState} notify={notify} />}
        {currentPath === 'feedback' && role === 'student' && <Feedback notify={notify} />}
        {currentPath === 'lost-found' && <LostFound role={role} user={displayUser} state={state} setState={setState} notify={notify} />}
        {currentPath === 'support' && <Support role={role} state={state} setState={setState} notify={notify} />}
        {!nav.some((item) => item[0] === currentPath) && <NotFound navigate={go} />}
      </main>
    </section>
  </div>
}

function UploadCsv({ label, onRows }) { const ref = useRef(null); return <><input ref={ref} type="file" accept=".csv,text/csv" style={{ display: 'none' }} onChange={(e) => { const file = e.target.files?.[0]; if (!file) return; file.text().then((text) => { const lines = text.split(/\r?\n/).map((line) => line.split(',').map((cell) => cell.trim())).filter((cells) => cells.some(Boolean)); onRows(lines.slice(1)) }); e.target.value = '' }} /><Button variant="secondary" onClick={() => ref.current?.click()}><UploadIcon size={16} /> {label}</Button></> }
function SemesterBar({ semester, setSemester }) { const data = getSemester(semester); return <div className="semester-bar"><div><span>Academic period</span><strong>{data.period}</strong></div><Select value={semester} onChange={setSemester}>{[1, 2, 3, 4, 5, 6].map((id) => <option key={id} value={id}>Semester {id}</option>)}</Select></div> }
function Dashboard({ role, semester, setSemester, state, navigate, notify }) {
  const student = getStudents()[0]; const summary = semesterSummary(state, student.id, semester); const data = getSemester(semester); const classAttendance = Math.round(getStudents().reduce((sum, item) => sum + semesterSummary(state, item.id, semester).percentage, 0) / getStudents().length); const average = role === 'staff' ? getStudents().reduce((sum, item) => sum + marksFor(state, item.id, semester).reduce((inner, row) => inner + row.internal + row.exam, 0) / data.subjects.length, 0) / getStudents().length : marksFor(state, student.id, semester).reduce((sum, row) => sum + row.internal + row.exam, 0) / data.subjects.length
  const recent = data.notifications
  return <><PageHeader eyebrow="Overview" title={`Good morning, ${role === 'staff' ? 'Academic Office' : student.name.split(' ')[0]}`} description={role === 'staff' ? 'Monitor academic activity across the current semester.' : 'Here is your academic snapshot for the selected semester.'} actions={<Button onClick={() => navigate('attendance')}><CheckSquare size={16} /> Attendance</Button>} /><SemesterBar semester={semester} setSemester={setSemester} />
    <div className="stats-grid"><StatCard icon={Users} label={role === 'staff' ? 'Active students' : 'Class strength'} value={role === 'staff' ? data.studentCount : data.classSize} hint={`${data.label} · Computer Engineering`} tone="blue" /><StatCard icon={CheckCircle} label="Attendance" value={`${role === 'staff' ? classAttendance : summary.percentage}%`} hint={role === 'staff' ? `Class average · ${data.label}` : `${summary.present} of ${summary.total} classes present`} tone="green" /><StatCard icon={BarChart3} label={role === 'staff' ? 'Class average' : 'Academic score'} value={`${Math.round(average)}%`} hint="Internal + examination marks" tone="purple" /><StatCard icon={Bell} label="Notifications" value={recent.length} hint="Updates for this semester" tone="orange" /></div>
    <div className="dashboard-grid"><section className="panel"><div className="panel-head"><div><h2>Academic performance</h2><span>{data.label} subject-wise overview</span></div><button className="text-btn" onClick={() => navigate('marks')}>View results <ArrowRight size={15} /></button></div><div className="performance-list">{marksFor(state, student.id, semester).map(({ subject, internal, exam }) => <div className="performance-row" key={subject.id}><div><strong>{subject.name}</strong><span>{subject.code} · {subject.faculty}</span></div><div className="progress"><i style={{ width: `${Math.min(100, internal + exam)}%` }} /></div><b>{internal + exam}/100</b></div>)}</div></section><section className="panel"><div className="panel-head"><div><h2>Recent updates</h2><span>Notices from the academic office</span></div><button className="text-btn" onClick={() => navigate('notifications')}>See all <ArrowRight size={15} /></button></div>{recent.map((item) => <div className="notice-line" key={item.id}><div className="notice-dot" /><div><strong>{item.title}</strong><span>{formatDate(item.date)}</span></div></div>)}</section></div>
  </>
}

function Profile({ role, user, notify }) { const [editing, setEditing] = useState(false); const [name, setName] = useState(user.name); return <><PageHeader eyebrow="Account" title="Profile" description="Keep your contact details up to date." actions={<Button variant={editing ? 'primary' : 'secondary'} onClick={() => { if (editing) notify('Profile changes saved.'); setEditing(!editing) }}>{editing ? <><Save size={16} /> Save changes</> : <><Edit size={16} /> Edit profile</>}</Button>} /><section className="profile-panel panel"><div className="profile-hero"><div className="profile-avatar">{name.slice(0, 1)}</div><div><h2>{name}</h2><p>{role === 'staff' ? 'Academic Office · Staff account' : 'KPC23CS041 · Diploma in Computer Engineering'}</p></div></div><div className="form-grid"><label>Full name<input disabled={!editing} value={name} onChange={(e) => setName(e.target.value)} /></label><label>Email address<input disabled value={user.email} /></label><label>Phone number<input disabled={!editing} defaultValue="+91 98765 43210" /></label><label>Department<input disabled value="Computer Engineering" /></label></div></section></> }

function Students({ semester, setSemester, state, navigate }) { const [query, setQuery] = useState(''); const [selected, setSelected] = useState(null); const rows = getStudents().filter((student) => `${student.name} ${student.id}`.toLowerCase().includes(query.toLowerCase())); return <><PageHeader eyebrow="People" title="Students" description="Search and review student academic records." actions={<Button onClick={() => navigate('reports')}><FileSpreadsheet size={16} /> Class report</Button>} /><SemesterBar semester={semester} setSemester={setSemester} /><section className="panel"><div className="toolbar"><div className="search"><Search size={17} /><input placeholder="Search by name or register number" value={query} onChange={(e) => setQuery(e.target.value)} /></div><span className="result-count">{rows.length} students</span></div><div className="table-scroll"><table><thead><tr><th>Student</th><th>Register no.</th><th>Attendance</th><th>Average</th><th>Action</th></tr></thead><tbody>{rows.map((row) => { const summary = semesterSummary(state, row.id, semester); const avg = marksFor(state, row.id, semester).reduce((sum, item) => sum + item.internal + item.exam, 0) / getSemester(semester).subjects.length; return <tr key={row.id}><td><div className="person-cell"><div className="mini-avatar">{row.name[0]}</div><span><strong>{row.name}</strong><small>{row.email}</small></span></div></td><td>{row.id}</td><td><span className={`pill ${summary.percentage < 75 ? 'red' : 'green'}`}>{summary.percentage}%</span></td><td>{Math.round(avg)}%</td><td><button className="icon-text" onClick={() => setSelected(row)}><Eye size={15} /> View</button></td></tr>})}</tbody></table></div>{!rows.length && <EmptyState title="No students found" text="Try a different name or register number." />}</section>{selected && <Modal title="Student profile" onClose={() => setSelected(null)}><div className="detail-card"><div className="profile-avatar small">{selected.name[0]}</div><h3>{selected.name}</h3><span>{selected.id}</span><p>{selected.program}</p><div className="detail-stats"><b>{semesterSummary(state, selected.id, semester).percentage}%<small>Attendance</small></b><b>{Math.round(marksFor(state, selected.id, semester).reduce((sum, item) => sum + item.internal + item.exam, 0) / getSemester(semester).subjects.length)}<small>Average mark</small></b></div></div></Modal>}</> }

function Attendance({ role, semester, setSemester, state, setState, notify }) {
  const data = getSemester(semester); const [subjectId, setSubjectId] = useState(data.subjects[0].id); const [date, setDate] = useState(data.dates[0]); const [studentId, setStudentId] = useState(getStudents()[0].id); const [editing, setEditing] = useState(false); const [draft, setDraft] = useState({});
  useEffect(() => { setSubjectId(data.subjects[0].id); setDate(data.dates[0]); setDraft({}); setEditing(false) }, [semester])
  useEffect(() => { if (role === 'staff') setDraft(Object.fromEntries(getStudents().map((student) => [student.id, state.attendance[keyFor(student.id, semester, subjectId, date)] || 'absent']))); else setDraft({}) }, [semester, subjectId, date, state.attendance, role])
  const subjectStats = data.subjects.map((subject) => ({ subject, ...attendanceSummary(state, studentId, semester, subject.id) }));
  const save = () => { setState((previous) => ({ ...previous, attendance: { ...previous.attendance, ...Object.fromEntries(Object.entries(draft).map(([id, status]) => [keyFor(id, semester, subjectId, date), status])) } })); setEditing(false); notify('Attendance saved successfully.'); }
  return <><PageHeader eyebrow="Daily records" title="Attendance" description="Daily Present / Absent / OD entries are the source of attendance calculations." actions={role === 'staff' ? <div className="button-group"><Button variant="secondary" onClick={() => downloadFile('attendance-template.csv', ['Register no,Status (present/absent/od)', ...getStudents().map((s) => `${s.id},present`)].join('\n'), 'text/csv')}><Download size={16} /> Template</Button><UploadCsv label="Upload attendance" onRows={(rows) => { const ids = new Set(getStudents().map((s) => s.id)); const entries = rows.filter(([id, st]) => ids.has((id || '').toUpperCase()) && ['present', 'absent', 'od'].includes((st || '').toLowerCase())).map(([id, st]) => [keyFor(id.toUpperCase(), semester, subjectId, date), st.toLowerCase()]); if (!entries.length) return notify('No valid rows found in the file.'); setState((previous) => ({ ...previous, attendance: { ...previous.attendance, ...Object.fromEntries(entries) } })); setEditing(false); notify(`Attendance uploaded for ${entries.length} students.`) }} />{editing && <Button variant="secondary" onClick={() => { setEditing(false); setDraft({}) }}>Cancel</Button>}<Button onClick={editing ? save : () => setEditing(true)}>{editing ? <><Save size={16} /> Save attendance</> : <><Edit size={16} /> Edit attendance</>}</Button></div> : <Button variant="secondary" onClick={() => downloadFile(`attendance-semester-${semester}.csv`, ['Subject,Code,Present,Absent,OD,Total,Percentage', ...subjectStats.map(({ subject, present, absent, od, total, percentage }) => `${subject.name},${subject.code},${present},${absent},${od},${total},${percentage}%`)].join('\n'), 'text/csv')}><Download size={16} /> Download</Button>} /><SemesterBar semester={semester} setSemester={setSemester} />
    <section className="panel filter-panel"><div className="filter-item"><label>Subject</label><Select value={subjectId} onChange={setSubjectId}>{data.subjects.map((subject) => <option key={subject.id} value={subject.id}>{subject.name} · {subject.code}</option>)}</Select></div><div className="filter-item"><label>Date</label><Select value={date} onChange={setDate}>{data.dates.map((item) => <option key={item} value={item}>{formatDate(item)}</option>)}</Select></div>{role === 'student' && <div className="filter-item"><label>Student</label><Select value={studentId} onChange={setStudentId}>{getStudents().map((item) => <option key={item.id} value={item.id}>{item.name}</option>)}</Select></div>}<div className="filter-meta"><span>Faculty</span><strong>{data.subjects.find((item) => item.id === subjectId)?.faculty}</strong></div></section>
    {role === 'staff' ? <section className="panel"><div className="panel-head"><div><h2>{getSemester(semester).subjects.find((item) => item.id === subjectId)?.name}</h2><span>{formatDate(date)} · {getStudents().length} students</span></div><span className="pill blue">{editing ? 'Editing enabled' : 'Read only'}</span></div><div className="table-scroll"><table><thead><tr><th>Student</th><th>Register no.</th><th>Current status</th><th>Mark attendance</th></tr></thead><tbody>{getStudents().map((item) => <tr key={item.id}><td><div className="person-cell"><div className="mini-avatar">{item.name[0]}</div><strong>{item.name}</strong></div></td><td>{item.id}</td><td><span className={`status ${draft[item.id] || 'absent'}`}>{draft[item.id] === 'absent' ? <XCircle size={14} /> : <Check size={14} />}{draft[item.id] === 'od' ? 'OD' : draft[item.id] === 'present' ? 'Present' : 'Absent'}</span></td><td><div className="segmented"><button disabled={!editing} className={draft[item.id] === 'present' ? 'selected-present' : ''} onClick={() => setDraft({ ...draft, [item.id]: 'present' })}>Present</button><button disabled={!editing} className={draft[item.id] === 'absent' ? 'selected-absent' : ''} onClick={() => setDraft({ ...draft, [item.id]: 'absent' })}>Absent</button><button disabled={!editing} className={draft[item.id] === 'od' ? 'selected-od' : ''} onClick={() => setDraft({ ...draft, [item.id]: 'od' })}>OD</button></div></td></tr>)}</tbody></table></div></section> : <><section className="attendance-summary-grid">{subjectStats.map(({ subject, present, absent, od, total, percentage }) => <div className="subject-attendance panel" key={subject.id}><div><span>{subject.code}</span><h3>{subject.name}</h3><small>{subject.faculty}</small></div><strong>{percentage}%</strong><div className="progress"><i style={{ width: `${percentage}%` }} /></div><small>{present} present · {absent} absent · {od} OD</small></div>)}</section><section className="panel"><div className="panel-head"><div><h2>Daily register</h2><span>{getSubjectName(data, subjectId)} · {getStudents().find((item) => item.id === studentId)?.name}</span></div></div><div className="daily-list">{data.dates.map((item) => { const status = state.attendance[keyFor(studentId, semester, subjectId, item)] || 'absent'; return <div key={item}><span>{formatDate(item)}</span><b className={`status ${status}`}>{status === 'present' ? <Check size={14} /> : <XCircle size={14} />}{status}</b></div>})}</div></section></>}
  </>
}
function getSubjectName(data, id) { return data.subjects.find((subject) => subject.id === id)?.name || 'Subject' }

function Marks({ role, semester, setSemester, state, setState, notify }) {
  const [studentId, setStudentId] = useState(getStudents()[0].id); const [editing, setEditing] = useState(false); const [draft, setDraft] = useState({}); const rows = marksFor(state, studentId, semester); const student = getStudents().find((item) => item.id === studentId)
  useEffect(() => { setEditing(false); setDraft({}) }, [semester, studentId])
  const save = () => { setState((previous) => ({ ...previous, marks: { ...previous.marks, ...Object.fromEntries(Object.entries(draft).map(([subjectId, values]) => [markKey(studentId, semester, subjectId), values])) } })); setEditing(false); notify('Marks updated successfully.'); }
  const setMark = (subjectId, field, value) => setDraft({ ...draft, [subjectId]: { ...(draft[subjectId] || rows.find((row) => row.subject.id === subjectId)), [field]: Math.max(0, Math.min(field === 'internal' ? 25 : field === 'exam' ? 75 : 10, Number(value) || 0)) } })
  return <><PageHeader eyebrow="Assessment" title="Marks / Results" description="Internal, examination and assignment marks for the selected semester." actions={role === 'staff' ? <div className="button-group"><Button variant="secondary" onClick={() => downloadFile(`marks-template-semester-${semester}.csv`, ['Register no,Subject code,Internal (25),Exam (75),Assignment (10)', ...getStudents().flatMap((s) => marksFor(state, s.id, semester).map((row) => `${s.id},${row.subject.code},${row.internal},${row.exam},${row.assignment}`))].join('\n'), 'text/csv')}><Download size={16} /> Template</Button><UploadCsv label="Upload marks" onRows={(rows) => { const ids = new Set(getStudents().map((s) => s.id)); const subs = getSemester(semester).subjects; const clamp = (v, max) => Math.max(0, Math.min(max, Number(v) || 0)); const entries = rows.map(([id, code, internal, exam, assignment]) => { const sub = subs.find((x) => x.code.toUpperCase() === (code || '').toUpperCase() || x.id === code); if (!sub || !ids.has((id || '').toUpperCase())) return null; return [markKey(id.toUpperCase(), semester, sub.id), { internal: clamp(internal, 25), exam: clamp(exam, 75), assignment: clamp(assignment, 10) }] }).filter(Boolean); if (!entries.length) return notify('No valid rows found in the file.'); setState((previous) => ({ ...previous, marks: { ...previous.marks, ...Object.fromEntries(entries) } })); setEditing(false); setDraft({}); notify(`Marks uploaded for ${entries.length} records.`) }} /><Button onClick={editing ? save : () => { setEditing(true); setDraft(Object.fromEntries(rows.map((row) => [row.subject.id, { internal: row.internal, exam: row.exam, assignment: row.assignment }])) )}}>{editing ? <><Save size={16} /> Save marks</> : <><Edit size={16} /> Edit marks</>}</Button></div> : <Button variant="secondary" onClick={() => downloadFile(`results-semester-${semester}.csv`, ['Subject,Internal,Exam,Assignment,Total', ...rows.map((row) => `${row.subject.name},${row.internal},${row.exam},${row.assignment},${row.internal + row.exam}`)].join('\n'), 'text/csv')}><Download size={16} /> Download results</Button>} /><SemesterBar semester={semester} setSemester={setSemester} />{role === 'staff' && <div className="inline-filter"><label>Student</label><Select value={studentId} onChange={setStudentId}>{getStudents().map((item) => <option key={item.id} value={item.id}>{item.name} · {item.id}</option>)}</Select></div>}<section className="panel"><div className="panel-head"><div><h2>{role === 'staff' ? student.name : 'Your semester result'}</h2><span>{getSemester(semester).label} · Maximum 100 per subject</span></div><span className="result-grade">{gradeFor(rows)} <small>Grade</small></span></div><div className="table-scroll"><table><thead><tr><th>Subject</th><th>Internal / 25</th><th>Exam / 75</th><th>Assignment / 10</th><th>Total</th><th>Result</th></tr></thead><tbody>{rows.map((row) => { const values = draft[row.subject.id] || row; const total = Number(values.internal || 0) + Number(values.exam || 0); return <tr key={row.subject.id}><td><strong>{row.subject.name}</strong><small className="table-sub">{row.subject.code} · {row.subject.faculty}</small></td><td>{editing ? <input className="table-input" type="number" value={values.internal} onChange={(e) => setMark(row.subject.id, 'internal', e.target.value)} /> : row.internal}</td><td>{editing ? <input className="table-input" type="number" value={values.exam} onChange={(e) => setMark(row.subject.id, 'exam', e.target.value)} /> : row.exam}</td><td>{editing ? <input className="table-input" type="number" value={values.assignment} onChange={(e) => setMark(row.subject.id, 'assignment', e.target.value)} /> : row.assignment}</td><td><strong>{total}</strong></td><td><span className={`pill ${total >= 40 ? 'green' : 'red'}`}>{total >= 40 ? 'Pass' : 'Review'}</span></td></tr>})}</tbody></table></div></section><div className="result-footnote"><AlertCircle size={15} /> Internal marks are out of 25, examination marks are out of 75. Results update after saving.</div></>
}
function gradeFor(rows) { const avg = rows.reduce((sum, row) => sum + row.internal + row.exam, 0) / Math.max(rows.length, 1); return avg >= 90 ? 'A+' : avg >= 80 ? 'A' : avg >= 70 ? 'B+' : avg >= 60 ? 'B' : avg >= 50 ? 'C' : 'D' }

function InternalAssessment({ semester, setSemester, state, setState, notify }) { const [assessment, setAssessment] = useState('IA 1'); const rows = getStudents().map((student) => ({ student, ...semesterSummary(state, student.id, semester), average: Math.round(marksFor(state, student.id, semester).reduce((sum, row) => sum + row.internal, 0) / getSemester(semester).subjects.length) })); return <><PageHeader eyebrow="Assessment" title="Internal Assessment" description="Review internal assessment readiness and attendance eligibility." actions={<Button onClick={() => { downloadFile(`internal-assessment-${semester}.csv`, ['Student,Attendance,Internal average,Eligibility', ...rows.map((row) => `${row.student.name},${row.percentage}%,${row.average},${row.percentage >= 75 ? 'Eligible' : 'Review'}`)].join('\n'), 'text/csv'); notify('Assessment report downloaded.') }}><Download size={16} /> Download report</Button>} /><SemesterBar semester={semester} setSemester={setSemester} /><div className="tabs"><button className={assessment === 'IA 1' ? 'active' : ''} onClick={() => setAssessment('IA 1')}>Internal Assessment I</button><button className={assessment === 'IA 2' ? 'active' : ''} onClick={() => setAssessment('IA 2')}>Internal Assessment II</button></div><section className="panel"><div className="table-scroll"><table><thead><tr><th>Student</th><th>Attendance</th><th>Internal average</th><th>Eligibility</th><th>Action</th></tr></thead><tbody>{rows.map((row) => <tr key={row.student.id}><td><div className="person-cell"><div className="mini-avatar">{row.student.name[0]}</div><strong>{row.student.name}</strong></div></td><td>{row.percentage}%</td><td>{row.average}/25</td><td><span className={`pill ${row.percentage >= 75 ? 'green' : 'orange'}`}>{row.percentage >= 75 ? 'Eligible' : 'Review'}</span></td><td><button className="icon-text" onClick={() => notify(`${row.student.name}'s ${assessment} record is up to date.`)}><Eye size={15} /> Review</button></td></tr>)}</tbody></table></div></section></> }

function Subjects({ role, semester, setSemester, state, setState, notify }) { const [show, setShow] = useState(false); const [newSubject, setNewSubject] = useState({ name: '', code: '', faculty: 'Nancy', credits: 4 }); const custom = state.subjectExtras?.[semester] || []; const subjects = [...getSemester(semester).subjects, ...custom]; const add = (event) => { event.preventDefault(); if (!newSubject.name.trim() || !newSubject.code.trim()) return; const subject = { ...newSubject, id: `custom-${Date.now()}` }; setState((previous) => ({ ...previous, subjectExtras: { ...(previous.subjectExtras || {}), [semester]: [...(previous.subjectExtras?.[semester] || []), subject] } })); setShow(false); setNewSubject({ name: '', code: '', faculty: 'Nancy', credits: 4 }); notify('Subject added to the semester catalogue.'); }; const remove = (id) => setState((previous) => ({ ...previous, subjectExtras: { ...(previous.subjectExtras || {}), [semester]: (previous.subjectExtras?.[semester] || []).filter((item) => item.id !== id) } })); return <><PageHeader eyebrow="Curriculum" title="Subjects" description={`${getSemester(semester).label} subject catalogue and faculty allocation.`} actions={role === 'staff' ? <Button onClick={() => setShow(true)}><Plus size={16} /> Add subject</Button> : <Button variant="secondary" onClick={() => downloadFile(`subjects-semester-${semester}.csv`, ['Code,Subject,Faculty,Credits', ...subjects.map((item) => `${item.code},${item.name},${item.faculty},${item.credits}`)].join('\n'), 'text/csv')}><Download size={16} /> Download catalogue</Button>} /><SemesterBar semester={semester} setSemester={setSemester} /><div className="subject-grid">{subjects.map((subject, index) => <article className="subject-card panel" key={subject.id}><div className={`subject-number n${index + 1}`}>0{index + 1}</div><div><span>{subject.code} · {subject.credits} credits</span><h3>{subject.name}</h3><p><User size={14} /> {subject.faculty}</p></div>{role === 'staff' && String(subject.id).startsWith('custom-') && <ConfirmButton onConfirm={() => { remove(subject.id); notify('Subject removed.') }}><Trash2 size={14} /></ConfirmButton>}</article>)}</div>{show && <Modal title="Add subject" onClose={() => setShow(false)}><form className="modal-form" onSubmit={add}><label>Subject name<input autoFocus value={newSubject.name} onChange={(e) => setNewSubject({ ...newSubject, name: e.target.value })} required /></label><label>Subject code<input value={newSubject.code} onChange={(e) => setNewSubject({ ...newSubject, code: e.target.value })} required /></label><div className="form-grid"><label>Faculty<Select value={newSubject.faculty} onChange={(faculty) => setNewSubject({ ...newSubject, faculty })}><option>Nancy</option><option>Janaki</option><option>Thilagaraj</option></Select></label><label>Credits<input type="number" min="1" max="6" value={newSubject.credits} onChange={(e) => setNewSubject({ ...newSubject, credits: Number(e.target.value) })} /></label></div><div className="modal-actions"><Button variant="secondary" onClick={() => setShow(false)}>Cancel</Button><Button type="submit"><Save size={16} /> Save subject</Button></div></form></Modal>}</> }

function Assignments({ role, semester, setSemester, state, setState, notify }) { const [show, setShow] = useState(false); const [filter, setFilter] = useState('All'); const [form, setForm] = useState({ title: '', subject: getSemester(semester).subjects[0].name, due: getSemester(semester).dates[0] }); const assignments = state.assignments?.[semester] || []; const subjects = getSemester(semester).subjects; const visible = filter === 'All' ? assignments : assignments.filter((item) => item.status === filter); const add = (e) => { e.preventDefault(); if (!form.title.trim()) return; setState((previous) => ({ ...previous, assignments: { ...previous.assignments, [semester]: [...(previous.assignments?.[semester] || []), { ...form, id: `assignment-${Date.now()}`, status: 'Open' }] } })); setShow(false); notify('Assignment published.'); }; const remove = (id) => setState((previous) => ({ ...previous, assignments: { ...previous.assignments, [semester]: previous.assignments[semester].filter((item) => item.id !== id) } })); return <><PageHeader eyebrow="Coursework" title="Assignments" description="Track coursework deadlines and submission status." actions={role === 'staff' ? <Button onClick={() => setShow(true)}><Plus size={16} /> Add assignment</Button> : <Button variant="secondary" onClick={() => downloadFile(`assignments-semester-${semester}.csv`, ['Title,Subject,Due date,Status', ...assignments.map((item) => `${item.title},${item.subject},${item.due},${item.status}`)].join('\n'), 'text/csv')}><Download size={16} /> Download list</Button>} /><SemesterBar semester={semester} setSemester={(value) => { setSemester(value); setForm({ ...form, subject: getSemester(value).subjects[0].name, due: getSemester(value).dates[0] }) }} /><div className="tabs"><button className={filter === 'All' ? 'active' : ''} onClick={() => setFilter('All')}>All ({assignments.length})</button><button className={filter === 'Open' ? 'active' : ''} onClick={() => setFilter('Open')}>Open</button><button classN const LF_CATEGORIES = ['Electronics', 'ID & Cards', 'Books & Stationery', 'Keys', 'Personal Accessories', 'Other']
const LF_STATUSES = ['Lost', 'Found', 'Claimed']
const lfTone = (status) => (status === 'Lost' ? 'red' : status === 'Found' ? 'orange' : 'green')
function LostFound({ role, user, state, setState, notify }) {
  const isStaff = role === 'staff'
  const userId = isStaff ? 'STAFF001' : 'KPC23CS041'
  const records = state.lostFound || []
  const [query, setQuery] = useState('')
  const [status, setStatus] = useState('All')
  const [category, setCategory] = useState('All')
  const [mine, setMine] = useState(false)
  const [form, setForm] = useState(null)
  const [view, setView] = useState(null)
  const today = new Date().toISOString().slice(0, 10)
  const rows = records.filter((r) => (status === 'All' || r.status === status) && (category === 'All' || r.category === category) && (!mine || r.createdById === userId) && `${r.name} ${r.category} ${r.location} ${r.description} ${r.id}`.toLowerCase().includes(query.toLowerCase()))
  const save = (list) => setState((previous) => ({ ...previous, lostFound: list(previous.lostFound || []) }))
  const open = (kind) => setForm({ name: '', category: LF_CATEGORIES[0], description: '', date: today, location: '', contact: isStaff ? 'Academic Office · Ext 204' : user.email, image: '', status: kind })
  const pickImage = (file) => {
    if (!file) return
    if (!file.type.startsWith('image/')) return notify('Please choose an image file.')
    if (file.size > 3 * 1024 * 1024) return notify('Image must be under 3 MB.')
    const reader = new FileReader()
    reader.onload = () => { const img = new Image(); img.onload = () => { const scale = Math.min(1, 480 / Math.max(img.width, img.height)); const canvas = document.createElement('canvas'); canvas.width = img.width * scale; canvas.height = img.height * scale; canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height); setForm((f) => ({ ...f, image: canvas.toDataURL('image/jpeg', 0.7) })) }; img.src = reader.result }
    reader.readAsDataURL(file)
  }
  const submit = (event) => {
    event.preventDefault()
    if (!form.name.trim() || !form.location.trim() || !form.contact.trim()) return notify('Please fill in item name, location and contact.')
    const now = new Date().toISOString()
    if (form.id) { save((list) => list.map((r) => (r.id === form.id ? { ...r, ...form, updatedAt: now } : r))); notify('Record updated.') }
    else { const record = { ...form, status: isStaff ? form.status : form.status === 'Found' ? 'Found' : 'Lost', id: `LF-${Date.now().toString().slice(-6)}`, createdById: userId, createdByName: user.name, createdByRole: role, createdAt: now, updatedAt: now }; save((list) => [record, ...list]); notify(`${record.status} item reported. Record ID ${record.id}.`) }
    setForm(null)
  }
  const setRecordStatus = (id, value) => { save((list) => list.map((r) => (r.id === id ? { ...r, status: value, updatedAt: new Date().toISOString() } : r))); notify(`Status changed to ${value}.`) }
  const remove = (id) => { save((list) => list.filter((r) => r.id !== id)); setView(null); notify('Record deleted.') }
  return <><PageHeader eyebrow="Campus" title="Lost & Found Register" description={isStaff ? 'Review, verify and update every lost and found report on campus.' : 'Report lost or found items and track the status of your reports.'} actions={<div className="button-group"><Button variant="secondary" onClick={() => open('Lost')}><Plus size={16} /> Report lost item</Button><Button onClick={() => open('Found')}><Plus size={16} /> Report found item</Button></div>} />
    <section className="panel filter-panel"><div className="filter-item"><label>Search</label><input style={{ width: '100%', border: '1px solid #dae2ec', borderRadius: 6, fontSize: 12, padding: '9px 11px', outline: 'none', color: '#34445e' }} placeholder="Search by item, category, location or ID" value={query} onChange={(e) => setQuery(e.target.value)} /></div><div className="filter-item"><label>Status</label><Select value={status} onChange={setStatus}><option value="All">All statuses</option>{LF_STATUSES.map((s) => <option key={s}>{s}</option>)}</Select></div><div className="filter-item"><label>Category</label><Select value={category} onChange={setCategory}><option value="All">All categories</option>{LF_CATEGORIES.map((c) => <option key={c}>{c}</option>)}</Select></div><Button variant={mine ? 'primary' : 'secondary'} onClick={() => setMine(!mine)}><Filter size={16} /> {isStaff ? 'My entries' : 'My reports'}</Button><div className="filter-meta"><span>Showing</span><strong>{rows.length} records</strong></div></section><section className="panel"><div className="table-scroll"><table><thead><tr><th>Record</th><th>Item</th><th>Category</th><th>Date</th><th>Location</th><th>Status</th><th>Reported by</th><th>Action</th></tr></thead><tbody>{rows.map((r) => <tr key={r.id}><td>{r.id}</td><td><strong>{r.name}</strong></td><td>{r.category}</td><td>{formatDate(r.date)}</td><td>{r.location}</td><td>{isStaff ? <Select value={r.status} onChange={(v) => setRecordStatus(r.id, v)}>{LF_STATUSES.map((s) => <option key={s}>{s}</option>)}</Select> : <span className={`pill ${lfTone(r.status)}`}>{r.status}</span>}</td><td>{r.createdByName}</td><td><div className="button-group"><button className="icon-text" onClick={() => setView(r)}><Eye size={15} /> View</button>{isStaff && <button className="icon-text" onClick={() => setForm({ ...r })}><Edit size={15} /> Edit</button>}{isStaff && <button className="icon-text" onClick={() => window.confirm('Delete this record? Use this for duplicate or inappropriate reports.') && remove(r.id)}><Trash2 size={15} /> Delete</button>}</div></td></tr>)}</tbody></table></div>
      {!rows.length && <EmptyState title="No records found" text="Try a different search or filter, or report an item." />}</section>
    {view && <Modal title={`${view.name} · ${view.id}`} onClose={() => setView(null)}><div className="modal-form">{view.image && <img src={view.image} alt={view.name} style={{ maxWidth: '100%', borderRadius: 12 }} />}<p><span className={`pill ${lfTone(view.status)}`}>{view.status}</span></p><p><strong>Category:</strong> {view.category}</p><p><strong>Date:</strong> {formatDate(view.date)}</p><p><strong>Location:</strong> {view.location}</p><p><strong>Description:</strong> {view.description || '—'}</p><p><strong>Contact:</strong> {view.contact}</p><p><strong>Reported by:</strong> {view.createdByName} ({view.createdById})</p>{isStaff && <div className="button-group">{LF_STATUSES.filter((s) => s !== view.status).map((s) => <Button key={s} variant="secondary" onClick={() => { setRecordStatus(view.id, s); setView({ ...view, status: s }) }}><CheckCircle size={16} /> Mark {s}</Button>)}</div>}</div></Modal>}
    {form && <Modal title={form.id ? 'Edit record' : `Report ${form.status.toLowerCase()} item`} onClose={() => setForm(null)}><form className="modal-form" onSubmit={submit}><label>Item name<input autoFocus value={form.name} onChange={(e) => setForm({ ...form, name: e.target.value })} required /></label><label>Category<select value={form.category} onChange={(e) => setForm({ ...form, category: e.target.value })}>{LF_CATEGORIES.map((c) => <option key={c}>{c}</option>)}</select></label><label>Description<textarea value={form.description} onChange={(e) => setForm({ ...form, description: e.target.value })} /></label><label>Date<input type="date" value={form.date} max={today} onChange={(e) => setForm({ ...form, date: e.target.value })} required /></label><label>Location<input value={form.location} onChange={(e) => setForm({ ...form, location: e.target.value })} required /></label><label>Contact information<input value={form.contact} onChange={(e) => setForm({ ...form, contact: e.target.value })} required /></label><label>Image (optional)<input type="file" accept="image/*" onChange={(e) => pickImage(e.target.files?.[0])} /></label>{form.image && <img src={form.image} alt="Preview" style={{ maxWidth: 160, borderRadius: 10 }} />}<label>Status<select value={form.status} disabled={!isStaff} onChange={(e) => setForm({ ...form, status: e.target.value })}>{LF_STATUSES.map((s) => <option key={s}>{s}</option>)}</select></label><div className="button-group"><Button variant="secondary" onClick={() => setForm(null)}>Cancel</Button><Button type="submit"><Save size={16} /> {form.id ? 'Save changes' : 'Submit report'}</Button></div></form></Modal>}
  </>
}

// ==== App.jsx ====
function readRoute() {
  const route = window.location.hash.replace(/^#\/?/, '').split('?')[0].trim()
  return route || 'dashboard'
}

function readSession() {
  const session = readJsonStorage('localStorage', 'kongu-session') || readJsonStorage('sessionStorage', 'kongu-session')
  return session && typeof session === 'object' && !Array.isArray(session) && ['student', 'staff'].includes(session.role) ? session : null
}

function App() {
  const [session, setSession] = useState(readSession)
  const [route, setRoute] = useState(readRoute)
  const [semester, setSemester] = useState(() => {
    const saved = readStorageItem('localStorage', 'kongu-semester')
    return ['1', '2', '3', '4', '5', '6'].includes(saved) ? saved : '1'
  })
  const [data, setData] = useState(loadState)
  const [toast, setToast] = useState('')

  useEffect(() => {
    const onHashChange = () => setRoute(readRoute())
    window.addEventListener('hashchange', onHashChange)
    return () => window.removeEventListener('hashchange', onHashChange)
  }, [])

  useEffect(() => {
    const save = () => writeStorageItem('localStorage', 'kongu-portal-data', JSON.stringify(data))
    const timer = window.setTimeout(save, 0)
    return () => window.clearTimeout(timer)
  }, [data])

  useEffect(() => {
    writeStorageItem('localStorage', 'kongu-semester', semester)
  }, [semester])

  const navigate = (nextRoute) => { window.location.hash = `/${nextRoute}` }
  const login = (role, credentials = {}) => {
    const expected = role === 'student' ? { id: 'KPC23CS041', password: 'student123' } : { id: 'STAFF001', password: 'staff123' }
    if (credentials.id?.trim().toUpperCase() !== expected.id || credentials.password !== expected.password) return false
    const next = { role, name: role === 'staff' ? 'Academic Office' : 'Arjun Kumar', email: role === 'staff' ? 'staff@kongupolytechnic.ac.in' : 'arjun.kumar@kongupolytechnic.ac.in' }
    removeStorageItem('localStorage', 'kongu-session')
    removeStorageItem('sessionStorage', 'kongu-session')
    writeStorageItem(credentials.remember ? 'localStorage' : 'sessionStorage', 'kongu-session', JSON.stringify(next))
    setSession(next)
    navigate('dashboard')
    return true
  }
  const logout = () => {
    if (!window.confirm('Are you sure you want to logout?')) return
    removeStorageItem('localStorage', 'kongu-session')
    removeStorageItem('sessionStorage', 'kongu-session')
    setSession(null)
    window.location.hash = '/'
  }
  const notify = (message) => setToast(message)

  if (!session) return <Login onLogin={login} />
  return <><AppErrorBoundary><Portal role={session.role} user={session} route={route} semester={semester} setSemester={setSemester} state={data} setState={setData} navigate={navigate} onLogout={logout} notify={notify} /></AppErrorBoundary>{toast && <div className="toast"><span className="toast-check">✓</span>{toast}<button onClick={() => setToast('')}>×</button></div>}</>
}



const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
